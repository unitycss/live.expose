<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>live.expose — owner console</title>
<style>
:root{
  --bg:#0a0710; --panel:#150f22; --border:#2a2038;
  --purple:#a970ff; --purple2:#7c3aed; --text:#f2eefb; --dim:#9d93b3;
}
*{box-sizing:border-box;}
html,body{margin:0; min-height:100%;}
body{
  background:radial-gradient(circle at 20% 0%, rgba(124,58,237,0.20), transparent 45%), var(--bg);
  color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  padding:32px 20px 80px;
}
.wrap{max-width:640px; margin:0 auto;}
h1{font-size:20px; letter-spacing:4px; margin:0 0 4px;}
h1 b{color:var(--purple);}
.sub{color:var(--dim); font-size:12px; margin:0 0 28px;}
.card{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px; margin-bottom:20px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11px; color:var(--dim); margin-bottom:6px; letter-spacing:1px;}
.field input{width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border);
  background:#0f0a19; color:var(--text); font-size:13px; outline:none;}
.field input:focus{border-color:var(--purple);}
.btn{border:none; background:linear-gradient(135deg,var(--purple),var(--purple2)); color:#fff;
  padding:11px 20px; border-radius:999px; font-size:13px; font-weight:600; cursor:pointer; width:100%;}
.btn.secondary{background:var(--panel); border:1px solid var(--border); color:var(--text); width:auto;}
.msg{font-size:12px; color:var(--dim); margin-top:10px; min-height:16px;}
.msg.error{color:#ff8a8a;}
.msg.ok{color:#8affb0;}
.list{display:flex; flex-direction:column; gap:10px;}
.row{display:flex; align-items:center; gap:12px; background:#0f0a19; border:1px solid var(--border); border-radius:10px; padding:8px 10px;}
.row img{width:44px; height:44px; object-fit:cover; border-radius:6px; flex-shrink:0;}
.row .info{flex:1; min-width:0;}
.row .info .n{font-size:13px; font-weight:600;}
.row .info .c{font-size:11px; color:var(--dim);}
.row button{background:none; border:1px solid var(--border); color:var(--dim); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:12px;}
#gate{max-width:360px; margin:100px auto;}
</style>
</head>
<body>

<div id="gate">
  <h1>LIVE<b>.</b>EXPOSE</h1>
  <p class="sub">owner console</p>
  <div class="card">
    <div class="field">
      <label>Owner key</label>
      <input type="password" id="keyInput" placeholder="paste your OWNER_KEY">
    </div>
    <button class="btn" id="enterBtn">Enter</button>
    <div class="msg" id="gateMsg"></div>
  </div>
</div>

<div class="wrap" id="console" style="display:none;">
  <h1>LIVE<b>.</b>EXPOSE</h1>
  <p class="sub">owner console — uploads go live on the site immediately</p>

  <div class="card">
    <div class="field"><label>Image file</label><input type="file" id="fileInput" accept="image/*"></div>
    <div class="field"><label>Name</label><input type="text" id="nameInput" placeholder="e.g. Nex N3x"></div>
    <div class="field"><label>Category</label><input type="text" id="catInput" placeholder="e.g. Goldtro"></div>
    <button class="btn" id="uploadBtn">Upload &amp; publish</button>
    <div class="msg" id="uploadMsg"></div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <strong style="font-size:13px;">Live items</strong>
      <button class="btn secondary" id="refreshBtn">Refresh</button>
    </div>
    <div class="list" id="list"></div>
  </div>

  <button class="btn secondary" id="signOutBtn">Sign out of this browser</button>
</div>

<script>
// No key is ever kept in this page's JS. Logging in exchanges your key for an
// HttpOnly session cookie that the server sets — this script can't read it,
// and it's sent automatically by the browser on every /api/images call.

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function showConsole(){
  document.getElementById('gate').style.display = 'none';
  document.getElementById('console').style.display = 'block';
  loadList();
}

document.getElementById('enterBtn').addEventListener('click', async ()=>{
  const key = document.getElementById('keyInput').value.trim();
  const msg = document.getElementById('gateMsg');
  if(!key){ msg.textContent = 'Enter your owner key.'; msg.className='msg error'; return; }
  msg.textContent = 'Checking…'; msg.className='msg';
  document.getElementById('keyInput').value = '';
  try{
    const res = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ key })
    });
    if(!res.ok){
      msg.textContent = 'Wrong key.'; msg.className='msg error'; return;
    }
    showConsole();
  }catch(e){
    msg.textContent = 'Could not reach the API.'; msg.className='msg error';
  }
});

document.getElementById('signOutBtn').addEventListener('click', async ()=>{
  try{ await fetch('/api/logout', { method:'POST' }); }catch(e){}
  location.reload();
});

document.getElementById('uploadBtn').addEventListener('click', async ()=>{
  const msg = document.getElementById('uploadMsg');
  const file = document.getElementById('fileInput').files[0];
  const name = document.getElementById('nameInput').value.trim();
  const category = document.getElementById('catInput').value.trim();

  if(!file){ msg.textContent = 'Choose an image first.'; msg.className='msg error'; return; }

  msg.textContent = 'Uploading…'; msg.className='msg';

  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result.split(',')[1];
    try{
      const res = await fetch('/api/images', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name, category, fileBase64: base64, fileType: file.type })
      });
      const data = await res.json();
      if(!res.ok){
        if(res.status === 401){ msg.textContent = 'Session expired — reload and log in again.'; msg.className='msg error'; return; }
        msg.textContent = 'Failed: ' + (data.error || res.status); msg.className='msg error'; return;
      }
      msg.textContent = 'Published — it is now live on the site.'; msg.className='msg ok';
      document.getElementById('fileInput').value = '';
      document.getElementById('nameInput').value = '';
      document.getElementById('catInput').value = '';
      loadList();
    }catch(e){
      msg.textContent = 'Upload failed.'; msg.className='msg error';
    }
  };
  reader.readAsDataURL(file);
});

document.getElementById('refreshBtn').addEventListener('click', loadList);

async function loadList(){
  const list = document.getElementById('list');
  list.innerHTML = '<div class="msg">Loading…</div>';
  try{
    const res = await fetch('/api/images');
    const items = await res.json();
    if(items.length===0){ list.innerHTML = '<div class="msg">No items yet.</div>'; return; }
    list.innerHTML = items.map(it=>`
      <div class="row">
        <img src="${it.url}" alt="">
        <div class="info">
          <div class="n">${escapeHtml(it.name||'Untitled')}</div>
          <div class="c">${escapeHtml(it.category||'uncategorized')}</div>
        </div>
        <button data-id="${it.id}">Delete</button>
      </div>
    `).join('');
    list.querySelectorAll('button[data-id]').forEach(b=>{
      b.addEventListener('click', async ()=>{
        b.disabled = true; b.textContent = '...';
        try{
          const res = await fetch('/api/images', {
            method:'DELETE',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ id: b.dataset.id })
          });
          if(res.status === 401){ alert('Session expired — reload and log in again.'); }
          loadList();
        }catch(e){ b.disabled=false; b.textContent='Delete'; }
      });
    });
  }catch(e){
    list.innerHTML = '<div class="msg error">Could not load items.</div>';
  }
}
</script>
</body>
</html>
